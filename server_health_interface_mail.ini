# 飞马 Interface + 邮件服务器巡检配置。
# 此配置用于飞马1。飞马2请使用 server_health_interface_mail_2.ini，避免把未部署组件报为异常。
# 不要填写密码、Token、私钥或数据库连接串中的凭据。

[basic]
# 必填：写入报告标题和默认 TXT 文件名。
SERVER_REMARK=飞马1-Interface邮件

# 宿主机基础服务。
SERVICE_NAMES=docker containerd crond chronyd NetworkManager rsyslog sshd rpcbind rpc-statd nfs-idmapd nfs-mountd nfsdcld

# 本角色已确认的 Interface、JOB、邮件 Python 服务及管理端口。
APP_PORTS=8083 8084 8089 8890 8090 8800

# Interface/JOB、邮件调度和管理端的进程总匹配规则。
APP_PATTERN=enrobot-api-0[.]1-SNAPSHOT[.]jar|rpa-admin-0[.]1-SNAPSHOT[.]jar|rpaAdmin-0[.]0[.]1-SNAPSHOT[.]jar|scheduler_deamon[.]pyc?|scheduler_mail[.]pyc?|scheduler_attach[.]pyc?|attach_job[.]pyc|mail_job[.]pyc

# 指定进程：名称,正则;名称,正则。
PROCESS_CHECKS=scheduler_deamon.pyc,scheduler_deamon[.]pyc;enrobot-api-0.1-SNAPSHOT.jar,enrobot-api-0[.]1-SNAPSHOT[.]jar;enrobot-api-0.1-SNAPSHOT.jar（JOB）,spring[.]profiles[.]active=job.*enrobot-api-0[.]1-SNAPSHOT[.]jar;rpa-admin-0.1-SNAPSHOT.jar,rpa-admin-0[.]1-SNAPSHOT[.]jar;rpaAdmin-0.0.1-SNAPSHOT.jar,rpaAdmin-0[.]0[.]1-SNAPSHOT[.]jar

[logs]
# Interface 的 Logback 日志目录由 rpa_interface/logback.xml 确认；Python 目录需按实际容器挂载确认。
LOG_DIRS=/home/enrobot/logs/api /home/enrobot/logs/python
LOG_STALE_MINUTES=10
LOG_LOOKBACK_HOURS=24
# 只选择时间范围内最新的 30 个日志文件，避免目录中几百个历史日志被全部扫描。
LOG_MAX_FILES=30
# 兼容旧版配置项；3.5.0开始，选中的WARN/ERROR日志会读取完整内容。
LOG_TAIL_BYTES=5242880
# 兼容旧版配置项；3.5.0开始，不再限制异常日志输出行数或单行长度。
LOG_ERROR_MAX_LINES=100

[directories]
# 邮件原图、处理中、重发和临时目录；不存在时报告会提示，便于核对宿主机挂载路径。
WATCH_DIRS=邮件原图,/home/enrobot/image/from_mail;邮件处理临时目录,/home/enrobot/temp/image/from_mail;邮件附件临时目录,/home/enrobot/temp/image/temp_mail;重发目录,/home/enrobot/resend;总临时目录,/home/enrobot/temp

[dependencies]
# 数据库、Redis、邮箱、中心 API、WMS 与 OCR 依赖。按生产网络实际情况修改地址或删除非必需项。
TCP_TARGETS=InterfaceMySQL,172.19.47.206,3000;CloudRedis,172.19.47.206,6379;POP3_163,pop.163.com,110;SMTP_QQ,smtp.exmail.qq.com,465;WMS,proxy.56feisu.com,9106;PaddleOCR,172.19.47.208,8002;图片分类,172.19.47.208,8003;印章OCR,124.222.186.97,8005

# 当前巡检不执行HTTP状态码和SSL证书探测；保留空项仅用于兼容旧配置格式。
HTTP_TARGETS=
SSL_TARGETS=

[docker]
DOCKER_ENABLED=1
DOCKER_REQUIRED_CONTAINERS=javajob8089 javaapi8084 javaapi8083 pyservice8890 rpaadmin8090 backendadmin8800
DOCKER_RESTART_WARN=3
DOCKER_LOG_TAIL=1000
